# O token tem iss = http://localhost:9090/... (URL vista pelo navegador);
# as chaves sao buscadas pela rede interna do Docker.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9090/realms/seguranca}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/seguranca/protocol/openid-connect/certs}

# Swagger UI com Authorization Code + PKCE
springdoc.swagger-ui.oauth.client-id=seguranca-swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# Nunca usar TRACE em commit: pode expor detalhes de requisicoes
logging.level.org.springframework.security=INFO
