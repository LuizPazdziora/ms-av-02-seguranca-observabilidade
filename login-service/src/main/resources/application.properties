spring.application.name=login
server.port=8080
# no Boot 4 a propriedade server.error.include-message foi substituida por spring.web.error.include-message
spring.web.error.include-message=always

# H2 (modo arquivo; no Docker o diretorio /data e um volume)
spring.datasource.url=${H2_URL:jdbc:h2:file:./data/logindb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2_USERNAME:sa}
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# OpenAPI: documenta somente as respostas declaradas em cada endpoint
# (sem replicar em todos os endpoints as respostas do GlobalExceptionHandler)
springdoc.override-with-generic-response=false

# Usuarios de demonstracao (senhas somente via ambiente)
demo.admin.senha=${DEMO_ADMIN_PASSWORD:}
demo.manutencao.senha=${DEMO_MANUTENCAO_PASSWORD:}
demo.usuarios.senha=${DEMO_USUARIOS_PASSWORD:}

# Actuator
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.java.enabled=true
# necessario para expor as propriedades info.app.* (o contribuidor "env" vem desligado por padrao)
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# Log
logging.level.aula.microservicos=DEBUG
