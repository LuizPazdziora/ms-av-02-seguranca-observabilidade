spring.application.name=login
server.port=8080
# no Boot 4 a propriedade server.error.include-message foi substituida por spring.web.error.include-message
spring.web.error.include-message=always

# H2 (modo arquivo; no Docker o diretorio /data e um volume)
spring.datasource.url=${H2_URL:jdbc:h2:file:./data/logindb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2_USERNAME:sa}
spring.datasource.password=${H2_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Usuarios de demonstracao (senhas somente via ambiente)
demo.admin.senha=${DEMO_ADMIN_PASSWORD:}
demo.manutencao.senha=${DEMO_MANUTENCAO_PASSWORD:}
demo.usuarios.senha=${DEMO_USUARIOS_PASSWORD:}

# Log
logging.level.aula.microservicos=DEBUG
